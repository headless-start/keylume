name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: new advisories for dependencies that haven't changed

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # the workspace includes the desktop app: WebKitGTK, the tray, SVG icons, and udev for hidapi
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      # the app embeds the built window (tauri.conf.json: frontendDist), so build it first
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the browser preview's library is generated by a Rust example (tools/ensure-fixtures.mjs)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # some of the app is Windows-only (audio and screen capture, process priority)
      - run: cargo clippy -p keylume-app --all-targets --locked -- -D warnings
      - run: cargo test -p keylume-app -p keylume-core --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # known vulnerabilities in any npm package, build tools included
      - run: npm audit --audit-level=moderate
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RustSec advisories for every crate in Cargo.lock (unmaintained crates are reported, not failed)
      - run: cargo audit
