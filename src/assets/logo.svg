<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Keylume: a dark keycap whose K shines through in the RGB spectrum, light pooling
       beneath it. The source of the app icon (tools/make_icon.mjs) and the in-app logo. -->
  <defs>
    <linearGradient id="kl-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#170c3a"/>
    </linearGradient>
    <linearGradient id="kl-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#6d6bff"/>
      <stop offset="0.68" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="kl-legend" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5ef0ff"/>
      <stop offset="0.5" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#ff6ad5"/>
    </linearGradient>
    <linearGradient id="kl-skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f4d"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <linearGradient id="kl-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3456"/>
      <stop offset="1" stop-color="#181b30"/>
    </linearGradient>
    <filter id="kl-pool" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="kl-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="kl-clip"><rect x="48" y="48" width="928" height="928" rx="216"/></clipPath>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#kl-tile)"/>
  <g clip-path="url(#kl-clip)">
    <ellipse cx="512" cy="792" rx="360" ry="96" fill="url(#kl-spectrum)" filter="url(#kl-pool)" opacity="0.95"/>
    <ellipse cx="512" cy="905" rx="420" ry="60" fill="url(#kl-spectrum)" filter="url(#kl-pool)" opacity="0.35"/>
  </g>
  <rect x="48.5" y="48.5" width="927" height="927" rx="216" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- the keycap: skirt, a rim of the light below, the top face -->
  <rect x="236" y="232" width="552" height="548" rx="124" fill="url(#kl-skirt)"/>
  <path d="M260 700 Q264 776 360 780 L664 780 Q760 776 764 700" fill="none" stroke="url(#kl-spectrum)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <rect x="288" y="252" width="448" height="420" rx="96" fill="url(#kl-face)"/>
  <path d="M336 276 L688 276" stroke="#ffffff" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round"/>
  <!-- the K, lit from inside: a soft halo, the coloured legend, a hot core -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M436 348 V 580 M600 348 L 452 468 L 606 580" stroke="url(#kl-legend)" stroke-width="112" filter="url(#kl-glow)" opacity="0.85"/>
    <path d="M436 348 V 580 M600 348 L 452 468 L 606 580" stroke="url(#kl-legend)" stroke-width="62"/>
    <path d="M436 348 V 580 M600 348 L 452 468 L 606 580" stroke="#ffffff" stroke-width="20" stroke-opacity="0.8"/>
  </g>
  <!-- a glint on the cap -->
  <path d="M676 330 L684 356 L710 364 L684 372 L676 398 L668 372 L642 364 L668 356 Z" fill="#ffffff" opacity="0.9"/>
</svg>
