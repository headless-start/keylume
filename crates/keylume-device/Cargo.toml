[package]
name = "keylume-device"
description = "USB HID transport for keylume keyboards, plus the keylume-cli tool."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keylume-proto = { path = "../keylume-proto" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6" }
